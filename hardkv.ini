[Server]
host=0.0.0.0
port=9736
max_connections=1000
secure=false          # tls on or off (ignores certs when off)
cert_file=/etc/hardkv/tls/server.crt
key_file=/etc/hardkv/tls/server.key

[memory] 
max_memory_mb=1024     # cache size limit
eviction_policy=LRU

# persistence is hardcoded so forget about turning it off
[persistence]
data_dir=/var/lib/hardkv

[logging]
level=INFO
file=/var/log/hardkv/hardkv.log